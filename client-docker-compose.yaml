version: '3.8'

services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: go-fiber-template-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["valkey-server", "--save", "", "--appendonly", "no"]

