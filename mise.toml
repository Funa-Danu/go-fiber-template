[tools]

go = "1.26"

[tasks.format]
description = "Format Go source files"
run = "gofmt -w ."

[tasks.lint]
description = "Run Go static checks"
run = "go vet ./..."

[tasks.run-server]
description = "Run the Fiber server"
run = "go run ./cmd/server"

[tasks.build-server]
description = "Build the Fiber server binary"
run = "go build -o bin/server ./cmd/server"
